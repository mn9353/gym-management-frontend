<div class="dashboard-page">
  <app-topbar [title]="pageTitle" [subtitle]="pageSubtitle" />

  <section class="panel">
    <h3>Add Member</h3>
    <p class="context-hint">{{ contextHint }}</p>

    @if (duplicateMember) {
      <div class="state warning">
        <strong>Existing member found:</strong> {{ duplicateMember.fullName }} ({{ duplicateMember.phone || 'no phone' }})<br />
        Current plan: {{ duplicateMember.planStartDate | date: 'dd MMM yyyy' }} to {{ duplicateMember.planEndDate | date: 'dd MMM yyyy' }}
        <div class="warning-actions">
          <button type="button" class="renew-btn" (click)="renewExistingMember()" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Processing...' : 'Renew Existing Member' }}
          </button>
        </div>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid">
        <label class="profile-photo">
          Profile Photo
          <div class="photo-actions">
            <label class="photo-btn">
              Choose image
              <input type="file" accept="image/*" (change)="onProfileImageSelected($event)" hidden />
            </label>
            <label class="photo-btn">
              Take photo
              <input type="file" accept="image/*" capture="environment" (change)="onProfileImageSelected($event)" hidden />
            </label>
            @if (profileImagePreviewUrl) {
              <button type="button" class="photo-clear" (click)="clearProfileImage()">Remove</button>
            }
          </div>
          @if (profileImagePreviewUrl) {
            <div class="photo-preview">
              <img [src]="profileImagePreviewUrl" alt="Profile preview" />
              <small>{{ profileImageName || 'Selected image' }}</small>
            </div>
          } @else {
            <small class="hint">Image is local preview only for now and is not uploaded yet.</small>
          }
        </label>

        <label>
          <span class="label-text">Full Name <span class="required">*</span></span>
          <input type="text" formControlName="fullName" />
          @if (showRequired('fullName')) {
            <small class="field-error">Full name is required.</small>
          }
        </label>

        <label>
          <span class="label-text">Phone <span class="required">*</span></span>
          <input
            type="tel"
            formControlName="phone"
            inputmode="numeric"
            maxlength="13"
            placeholder="+919876543210"
            (input)="onPhoneInput($event)"
          />
          @if (showRequired('phone')) {
            <small class="field-error">Phone is required.</small>
          }
          @if (showPhoneFormatError()) {
            <small class="field-error">Phone must be in +91XXXXXXXXXX format.</small>
          }
        </label>

        <label>
          Email
          <input type="email" formControlName="email" placeholder="member@example.com" />
          @if (showEmailFormatError()) {
            <small class="field-error">Enter a valid email format (example: name&#64;example.com).</small>
          }
        </label>

        <label>
          Training Type
          <select formControlName="trainingType">
            <option value="GENERAL">GENERAL</option>
            <option value="PERSONAL">PERSONAL</option>
          </select>
        </label>

        <label class="trainer-slot" [class.trainer-hidden]="!shouldShowTrainerField">
          Assigned Trainer <span class="required">*</span>
          @if (isTrainerContext) {
            <input type="text" formControlName="trainerAssigned" readonly />
          } @else {
            <select formControlName="trainerAssigned">
              <option value="">Select trainer</option>
              @for (trainer of trainers; track trainer) {
                <option [value]="trainer">{{ trainer }}</option>
              }
            </select>
          }
          @if (!isTrainerContext && loadingTrainers) {
            <small class="hint">Loading trainers...</small>
          }
          @if (showTrainerRequiredError()) {
            <small class="field-error">Trainer is required for PERSONAL training.</small>
          }
        </label>

        <label>
          Lead Source
          <input type="text" formControlName="leadSource" placeholder="Walk-in / Referral / Social Media (optional)" />
        </label>

        <label>
          Target Weight (kg)
          <input type="number" min="0" step="0.1" formControlName="targetWeight" placeholder="Optional" />
        </label>

        <label>
          <span class="label-text">Start / Join Date <span class="required">*</span></span>
          <input type="date" formControlName="joinDate" />
          @if (showRequired('joinDate')) {
            <small class="field-error">Start / Join date is required.</small>
          }
        </label>

        <label>
          <span class="label-text">Plan Duration (months) <span class="required">*</span></span>
          <input type="number" min="1" max="24" formControlName="planDurationMonths" />
          @if (showRequired('planDurationMonths')) {
            <small class="field-error">Plan duration is required.</small>
          }
          @if (showRangeError('planDurationMonths')) {
            <small class="field-error">Plan duration must be between 1 and 24 months.</small>
          }
        </label>

        <label>
          <span class="label-text">Amount To Pay <span class="required">*</span></span>
          <input type="number" min="0" formControlName="amountToPay" />
          @if (showRequired('amountToPay')) {
            <small class="field-error">Amount to pay is required.</small>
          }
        </label>

        <label>
          Amount Paid
          <input type="number" formControlName="amountPaid" />
        </label>

        <label>
          Payment Mode
          <select formControlName="paymentMode">
            <option value="UPI">UPI</option>
            <option value="CASH">CASH</option>
            <option value="CARD">CARD</option>
          </select>
          @if (showPaymentModeRequired()) {
            <small class="field-error">Payment mode is required when amount paid is greater than 0.</small>
          }
        </label>

        <label class="computed">
          Computed Plan End Date
          <input type="text" [value]="computedPlanEndDateLabel" readonly />
        </label>

      </div>

      <button type="submit" class="submit-btn" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Saving...' : 'Add Member' }}
      </button>
    </form>
  </section>
</div>

<app-confirm-dialog
  [open]="confirmDialog.open"
  [title]="confirmDialog.title"
  [messageLines]="confirmDialog.lines"
  [confirmText]="confirmDialog.confirmText"
  [tone]="confirmDialog.tone"
  [busy]="isSubmitting"
  (cancel)="onConfirmDialogClose()"
  (confirm)="onConfirmDialogSubmit()"
/>
