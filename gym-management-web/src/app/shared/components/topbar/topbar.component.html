<header class="topbar-shell">
  <div class="brand-group">
    <button type="button" class="icon-button menu-btn" (click)="toggleMenu()" aria-label="Open navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="brand">
      <span class="brand-full">{{ gymName }}</span>
      <span class="brand-short">{{ gymShortName }}</span>
    </div>
  </div>

  <div class="right-actions">
    <button
      type="button"
      class="theme-trigger"
      [class.is-dark]="isDarkTheme"
      [attr.aria-label]="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'"
      (click)="toggleTheme()"
    >
      <span class="material-symbols-outlined bubble-icon" aria-hidden="true">
        {{ isDarkTheme ? 'dark_mode' : 'light_mode' }}
      </span>
    </button>
    <button type="button" class="user-chip" (click)="toggleUserMenu()" [attr.aria-label]="'Open user menu for ' + userName">
      @if (userProfileImageUrl) {
        <img [src]="userProfileImageUrl" [alt]="userName" class="user-avatar-img" />
      } @else {
        {{ userInitials }}
      }
    </button>
  </div>
</header>

@if (isMenuOpen) {
  <aside class="side-menu">
    <p class="menu-title">Sections</p>
    <nav>
      @for (item of menuItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? true }"
          (click)="closeMenus()"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>
}

@if (isUserMenuOpen) {
  <div class="user-menu">
    <strong>{{ userName }}</strong>
    <span>{{ userRole }}</span>
    <span>{{ gymName }}</span>
    <button type="button" class="action-btn" (click)="openChangePassword()">Change Password</button>
    <button type="button" class="logout-btn" (click)="logout()">Logout</button>
  </div>
}

@if (showChangePasswordModal) {
  <div class="modal-backdrop" (click)="closeChangePassword()">
    <div class="modal-surface panel" (click)="$event.stopPropagation()">
      <h3>Change Password</h3>
      <form [formGroup]="changePasswordForm" (ngSubmit)="submitChangePassword()">
        <label>
          Old Password
          <input type="password" formControlName="oldPassword" placeholder="Current password" />
        </label>
        
        <label>
          New Password
          <input type="password" formControlName="newPassword" placeholder="New password" />
          @if (changePasswordForm.get('newPassword')?.touched && changePasswordForm.get('newPassword')?.hasError('pattern')) {
            <small class="field-error">Min 8 chars, 1 uppercase, 1 lowercase, 1 number, 1 special char.</small>
          }
        </label>
        
        <label>
          Confirm New Password
          <input type="password" formControlName="confirmPassword" placeholder="Confirm new password" />
          @if (changePasswordForm.get('confirmPassword')?.touched && changePasswordForm.hasError('mismatch')) {
            <small class="field-error">Passwords do not match.</small>
          }
        </label>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" (click)="closeChangePassword()" [disabled]="isChangingPassword">Cancel</button>
          <button type="submit" [disabled]="changePasswordForm.invalid || isChangingPassword">
            {{ isChangingPassword ? 'Saving...' : 'Save Password' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
